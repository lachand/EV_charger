name: Feature request
description: Something the integration should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check [docs/ROADMAP.md](https://github.com/lachand/EV_charger/blob/main/docs/ROADMAP.md)
        first — it lists what is planned, what is done, and what was
        deliberately dropped (and why).

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: |
        The situation, not the solution. "Charge only when my tariff is cheap"
        is more useful than "add a price sensor option", because it leaves room
        for a simpler answer.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What you do today instead
      description: An automation, a template sensor, or nothing at all.

  - type: input
    id: model
    attributes:
      label: Charger model
      description: Some features depend on DPs that not every firmware exposes.
