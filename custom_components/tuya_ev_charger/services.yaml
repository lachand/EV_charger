force_charge_for:
  fields:
    entry_id:
      selector:
        config_entry:
          integration: tuya_ev_charger
    duration_minutes:
      required: true
      selector:
        number:
          min: 0
          max: 1440
          step: 1
          mode: box
    current_a:
      selector:
        number:
          min: 6
          max: 32
          step: 1
          mode: box

pause_surplus:
  fields:
    entry_id:
      selector:
        config_entry:
          integration: tuya_ev_charger
    duration_minutes:
      required: true
      selector:
        number:
          min: 0
          max: 1440
          step: 1
          mode: box

profile_assistant:
  fields:
    entry_id:
      selector:
        config_entry:
          integration: tuya_ev_charger
    apply:
      selector:
        boolean:

set_surplus_profile:
  fields:
    entry_id:
      selector:
        config_entry:
          integration: tuya_ev_charger
    profile:
      required: true
      selector:
        select:
          options:
            - eco
            - balanced
            - fast
