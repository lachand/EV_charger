[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting -- hand-fixed several times before this existed
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # Home Assistant schemas call functions in defaults by design
]

[tool.ruff.lint.per-file-ignores]
# The stubs deliberately build modules and classes dynamically.
"tests/conftest.py" = ["B010", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.coverage.run]
source = ["custom_components/tuya_ev_charger"]
omit = [
    # Entity platforms are thin wrappers over the coordinator; covering them
    # would mostly assert that Home Assistant works.
    "*/binary_sensor.py",
    "*/button.py",
    "*/time.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
