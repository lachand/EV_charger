[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting -- hand-fixed several times before this existed
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # Home Assistant schemas call functions in defaults by design
]

[tool.ruff.lint.per-file-ignores]
# The stubs deliberately build modules and classes dynamically.
"tests/conftest.py" = ["B010", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
